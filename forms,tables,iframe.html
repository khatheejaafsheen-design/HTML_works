<html>
<head lang ="en">

    <meta charset="UTF-8">
    <meta name ="viewport" content = "width=device-width , initial-scale="1.0">
    <meta name ="author" content ="afsheen">
    <title>
         My Students 
    </title>
</head>

<body>
    <table border="2">
        <caption style ="color:rgb(180, 20, 20);">Student Management Record</caption>
        <thead>
            <th>Name</th>
            <th>Age</th>
            <th>Marks</th>
        </thead>

        <tbody>
            <tr>
                <td>Afsheen</td>
                <td>18</td>
                <td>96</td>
            </tr>
            <tr>
                <td>Suba</td>
                <td>19</td>
                <td>98</td>
            </tr>

            <tr>
                <td>
                    Udaya
                </td>
                <td>18</td>
                <td>95</td>
            </tr>
        </tbody>

        <tfooter>
            <tr>
                <td colspan ="2">Students Marks Verified</td>
            </tr>
        </tfooter>
    </table>


    <hr>
    <br><br>
    <fieldset>
        <legend>Student Details </legend>
    <form action="#" method="post">

        
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your name" required>

        <br><br>

        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>

        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password"
               name="password" required>

        <br><br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age"
               min="18" max="60">

        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">

        <br><br>

        <p>Gender:</p>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <br><br>

        <p>Skills:</p>

        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label>

        <input type="checkbox" id="java" name="skills" value="Java">
        <label for="java">Java</label>

        <br><br>
        <label for="course">Course:</label>

        <select id="course" name="course">
            <option value="">Select Course</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="IT">IT</option>
        </select>

        <br><br>

        
        <label for="address">Address:</label>

        <textarea id="address" name="address"
                  rows="4" cols="30"
                  placeholder="Enter your address"></textarea>

        <br><br>

        <label for="file">Upload Resume:</label>
        <input type="file" id="file" name="resume">

        <br><br>
         
        <button type="submit">Register</button>
        <button type="reset">Reset</button>

    </form>
</fieldset>

<audio controls>
    <source src ="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">

</audio>

<video width ="400" height ="300" control>
    <source src ="https://www.w3schools.com/html/mov_bbb.mp4"  type ="video/mp4">

</video>

<iframe src ="https://example.com"  height="400"  width="600">

</iframe>
</body>
</html>
